<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-storage-compat.js"></script>
    <!-- Leaflet CSS and JavaScript -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #map {
            height: 300px;
            width: 100%;
        }

        .submit-container {
            text-align: center;
            margin-top: 20px;
        }

        .submit-container button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #007bff;
            color: #fff;
            font-size: 16px;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <form id="multiStepForm">
            <!-- General Details -->
            <div class="form-group">
                <label for="citizenshipCertificateNo">Citizenship Certificate no:</label>
                <input type="text" id="citizenshipCertificateNo" />
            </div>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" />
            </div>
            <div class="form-group">
                <label for="sex">Gender</label>
                <input type="text" id="sex" />
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="text" id="dob" />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" />
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" />
            </div>

            <!-- Address Details -->
            <!-- <div class="form-group">
                <label for="district">District</label>
                <input type="text" id="district" name="district" />
            </div>
            <div class="form-group">
                <label for="municipality">Municipality</label>
                <input type="text" id="municipality" name="municipality" />
            </div>-->

            <div class="form-group">
                <label for="permanent">Permanent Address</label>
                <input type="text" id="permanent" name="permanent" />
            </div>

            <!-- Family Details -->
            <div class="form-group">
                <label for="fatherName">Father's Name</label>
                <input type="text" id="fatherName" />
            </div>
            <div class="form-group">
                <label for="motherName">Mother's Name</label>
                <input type="text" id="motherName" />
            </div>
            <div class="form-group">
                <label for="grandfatherName">Grandfather's Name</label>
                <input type="text" id="grandfatherName" />
            </div>

            <div id="temporaryAddressFields"></div>

            <button id="addTemporaryBtn">+ Mark Your Location</button>
            <div id="temporaryAddressMap" style="display: none;">
                <div id="map"></div>
            </div>

            <!-- Profile Picture -->
            <div class="form-group">
                <label for="profilePicture">Profile Picture</label>
                <img id="profilePicture" class="profile-pic" src="" alt="Profile Picture" />
            </div>

            <div class="form-group">
                <label for="backCiti">Citizenship Back</label>
                <img id="backCiti" class="citi-back" src="" alt="Citizenship Back" />
            </div>

            <div class="form-group">
                <label for="frontCiti">Citizenship Front</label>
                <img id="frontCiti" class="citi-front" src="" alt="Citizenship Front" />
            </div>

            <!-- Final Step -->
            <div class="form-group">
                <p>Thank you for reviewing your information, now click the button to get your bank account in your
                    mail/phone.</p>
            </div>

            <div class="submit-container">
                <button id="submitButton" class="next">Submit</button>
            </div>
        </form>
        <!-- Add Fetch Data Button -->
        <div class="fetch-container">
            <button id="fetchDataButton" class="fetch">Fetch Data</button>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAgBitNYqw46PnNqTsfCyxVg4_7772W0Fc",
            authDomain: "bankrobot12.firebaseapp.com",
            databaseURL: "https://bankrobot12-default-rtdb.firebaseio.com",
            projectId: "bankrobot12",
            storageBucket: "bankrobot12.appspot.com",
            messagingSenderId: "661160441016",
            appId: "1:661160441016:web:2a087596d75109e3f3704d",
            measurementId: "G-GVM341TNT7"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage();

        // Handle Add Temporary Address Button Click
        document.getElementById('addTemporaryBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            document.getElementById('temporaryAddressMap').style.display = 'block';

            // Fetch latitude and longitude from the database
            try {
                const snapshot = await database.ref('extracted_data/Prabin Tiwari/Location').once('value');
                const data = snapshot.val();

                if (data && data.Latitude && data.Longitude) {
                    const latitude = data.Latitude;
                    const longitude = data.Longitude;

                    // Initialize Leaflet map
                    const map = L.map('map').setView([latitude, longitude], 13);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                    }).addTo(map);

                    let marker;
                    map.on('click', function (e) {
                        if (marker) {
                            map.removeLayer(marker);
                        }
                        marker = L.marker(e.latlng).addTo(map);
                    });
                } else {
                    console.error('Location data not found.');
                }
            } catch (error) {
                console.error('Error fetching location data:', error);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('fetchDataButton').addEventListener('click', () => {
                // Fetch data for PRABIN_TIWARI
                database.ref('extracted_data/Prabin Tiwari').once('value').then(snapshot => {
                    const data = snapshot.val();
                    console.log("Fetched data:", data); // Debugging log

                    if (data) {
                        // Populate form fields
                        document.getElementById('citizenshipCertificateNo').value = data["Citizenship Certificate No"];
                        document.getElementById('fullName').value = data["Full Name"];
                        document.getElementById('fatherName').value = data["Father's Name"];
                        document.getElementById('motherName').value = data["Mother's Name"];
                        document.getElementById('grandfatherName').value = data["Grandfather's Name"];
                        document.getElementById('email').value = data["email"];
                        document.getElementById('phone').value = data["Phone Number"];
                        document.getElementById('sex').value = data["Sex"];
                        document.getElementById('dob').value = data["Date of Birth"];
                        document.getElementById('permanent').value = data["Permanent Address"];

                        // Fetch and display profile picture
                        const profilePicUrl = data.PassportPhotoURL || 'https://storage.googleapis.com/bankrobot12.appspot.com/photo/PRABIN%20TIWARI.jpg';
                        if (profilePicUrl) {
                            storage.refFromURL(profilePicUrl).getDownloadURL().then(url => {
                                document.getElementById('profilePicture').src = url;
                            }).catch(error => console.error("Error fetching profile picture:", error));
                        }

                        // Fetch and display citizenship back image
                        const backCitiUrl = data.BackImageURL || 'https://storage.googleapis.com/bankrobot12.appspot.com/back/PRABIN%20TIWARI.jpg';
                        if (backCitiUrl) {
                            storage.refFromURL(backCitiUrl).getDownloadURL().then(url => {
                                document.getElementById('backCiti').src = url;
                            }).catch(error => console.error("Error fetching citizenship back image:", error));
                        }

                        // Fetch and display citizenship front image
                        const frontCitiUrl = data.FrontImageURL || 'https://storage.googleapis.com/bankrobot12.appspot.com/front/PRABIN%20TIWARI.jpg';
                        if (frontCitiUrl) {
                            storage.refFromURL(frontCitiUrl).getDownloadURL().then(url => {
                                document.getElementById('frontCiti').src = url;
                            }).catch(error => console.error("Error fetching citizenship front image:", error));
                        }
                    }
                }).catch(error => console.error("Error fetching data:", error));
            });
        });

        document.getElementById('submitButton').addEventListener('click', (e) => {
            e.preventDefault();

            // Retrieve form data
            const citizenshipCertificateNo = document.getElementById('citizenshipCertificateNo').value;
            const fullName = document.getElementById('fullName').value;
            const sex = document.getElementById('sex').value;
            const dob = document.getElementById('dob').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const permanent = document.getElementById('permanent').value;
            const fatherName = document.getElementById('fatherName').value;
            const motherName = document.getElementById('motherName').value;
            const grandfatherName = document.getElementById('grandfatherName').value;

            // Get URLs of images
            const profilePicUrl = document.getElementById('profilePicture').src;
            const backCitiUrl = document.getElementById('backCiti').src;
            const frontCitiUrl = document.getElementById('frontCiti').src;

            // Create data object
            const data = {
                "Citizenship Certificate No": citizenshipCertificateNo,
                "Full Name": fullName,
                "Sex": sex,
                "Date of Birth": dob,
                "email": email,
                "Phone Number": phone,
                "Permanent Address": permanent,
                "Father's Name": fatherName,
                "Mother's Name": motherName,
                "Grandfather's Name": grandfatherName,
                "ProfilePictureURL": profilePicUrl,
                "BackCitiURL": backCitiUrl,
                "FrontCitiURL": frontCitiUrl
            };

            // Save data to Firebase
            database.ref('users/' + citizenshipCertificateNo).set(data)
                .then(() => {
                    console.log("Data saved successfully.");
                    window.location.href = 'index.html'; // Redirect to the target page
                })
                .catch((error) => {
                    console.error("Error saving data:", error);
                });
        });
    </script>
</body>

</html>
